version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data_store:/app/backend/data_store
    environment:
      - DEFAULT_PROJECTED_CRS=EPSG:32643
      - DEFAULT_GEOGRAPHIC_CRS=EPSG:4326
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
